 const detail=kind==='cancel'?t('Уже полученные сведения останутся. Отмена касается только этого поиска.','Вже отримані відомості залишаться. Скасування стосується лише цього пошуку.'):kind==='stop'?t('Отправленные сообщения не удаляются. Сообщение в процессе отправки может уже попасть в канал — его результат останется неизвестным.','Надіслані повідомлення не видаляються. Повідомлення в процесі надсилання може вже потрапити до каналу — його результат залишиться невідомим.'):unknown?t('Сообщение могло быть опубликовано. Проверьте канал: ручной повтор может создать дубль.','Повідомлення могло бути опубліковано. Перевірте канал: ручний повтор може створити дубль.'):t('В приложении сначала потребуется исправить права канала. Здесь можно только показать повтор в демонстрационной очереди.','У застосунку спочатку потрібно буде виправити права каналу. Тут можна лише показати повтор у демонстраційній черзі.');
 modal(title,`<p><b>${e(actionSource)} · ${e(projects[actionSource].find(p=>p.id===run.project)?.name)} · 08.10, ${run.time}</b>${message?'<br>'+e(message.channel)+' · '+e(lots[actionSource].find(l=>l.id===message.lot)?.name||message.lot):''}</p><p>${e(detail)}</p><div class="editor-note">${e(t('Только макет: поиск и отправка не запускаются.','Лише макет: пошук і надсилання не запускаються.'))}</div>${unknown?`<label class="editor-toggle history-confirm"><input type="checkbox" id="confirm-repeat"><span>${e(t('Проверил канал и понимаю риск повторной публикации','Перевірив канал і розумію ризик повторної публікації'))}</span></label>`:''}<div class="history-dialog-actions"><button class="app-button" id="history-action-cancel">${e(t('Назад','Назад'))}</button><button class="app-button primary" id="history-action-confirm" ${unknown?'disabled':''}>${e(t('Подтвердить · демо','Підтвердити · демо'))}</button></div>`);$('dialog-close').hidden=true;$('history-action-cancel').onclick=()=>$('dialog').close();if($('confirm-repeat'))$('confirm-repeat').onchange=()=>$('history-action-confirm').disabled=!$('confirm-repeat').checked;
 $('history-action-confirm').onclick=()=>{if(kind==='cancel')run.status='canceled';else if(kind==='stop')run.delivery=stopDelivery(run.delivery);else if(message)message.state='waiting';$('dialog').close();source=actionSource;state().history.expanded.add(run.id);if(kind!=='cancel')state().history.tabs[run.id]='delivery';render();$('mock-toast').textContent=t('Изменено только демо-состояние. Реальных действий не было.','Змінено лише демо-стан. Реальних дій не було.');$('mock-toast').hidden=false;(document.querySelector('[data-toggle-run="'+id+'"]')||$('history-status'))?.focus();};
}
function bindHistory(){const view=state().history;if(!view)return;for(const [id,key]of [['history-project','project'],['history-status','filter'],['history-preview-state','screen']])if($(id))$(id).onchange=()=>{view[key]=$(id).value;render();$(id).focus();};
 document.querySelectorAll('[data-toggle-run]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggleRun;view.expanded.has(id)?view.expanded.delete(id):view.expanded.add(id);render();document.querySelector('[data-toggle-run="'+id+'"]')?.focus();});
 document.querySelectorAll('[data-run-tab]').forEach(b=>b.onclick=()=>{const id=b.dataset.ownerRun,tab=b.dataset.runTab;view.tabs[id]=tab;render();document.querySelector('[data-owner-run="'+id+'"][data-run-tab="'+tab+'"]')?.focus();});
 document.querySelectorAll('[data-change-filter]').forEach(s=>s.onchange=()=>{const id=s.dataset.changeFilter;view.changeFilters[id]=s.value;render();document.querySelector('[data-change-filter="'+id+'"]')?.focus();});
 document.querySelectorAll('[data-cancel-run]').forEach(b=>b.onclick=()=>historyAction('cancel',b.dataset.cancelRun));document.querySelectorAll('[data-stop-delivery]').forEach(b=>b.onclick=()=>historyAction('stop',b.dataset.stopDelivery));document.querySelectorAll('[data-message-retry]').forEach(b=>b.onclick=()=>historyAction('retry',b.dataset.ownerRun,b.dataset.messageRetry));
 document.querySelectorAll('[data-run-project]').forEach(b=>b.onclick=()=>{state().project=b.dataset.runProject;state().tab='projects';section='projects';state().section=section;render();$('current-settings')?.focus();});if($('history-reset'))$('history-reset').onclick=()=>{view.project='';view.filter='';render();$('history-project').focus();};if($('history-reload'))$('history-reload').onclick=()=>{view.screen='list';render();$('history-preview-state').focus();};
}
let encarCleanup=()=>{},encarGeneration=0;
async function mountEncarPreview(generation){try{const preview=await import('./encar-preserved/dist/encar-preview.js');if(generation!==encarGeneration||!$('encar-preserved-host'))return;encarCleanup=preview.mount($('encar-preserved-host'),{projects:projects.Encar,lots:lots.Encar,lang,section,create:()=>openEditor(),edit:id=>openEditor(projects.Encar.find(p=>p.id===id)),notice:message=>modal('Encar · '+t('макет','макет'),`<p>${e(message)}</p>`)});}catch{if(generation!==encarGeneration||!$('encar-preserved-host'))return;$('encar-preserved-host').innerHTML=`<div class="empty" role="alert"><h2>${e(t('Encar-preview не собран','Encar-preview не зібраний'))}</h2><p>${e(t('Соберите docs/mockups/encar-preserved/vite.config.mjs локальной командой Vite. Рабочее приложение не изменяется.','Зберіть docs/mockups/encar-preserved/vite.config.mjs локальною командою Vite. Робочий застосунок не змінюється.'))}</p></div>`;}}
function render(){encarCleanup();encarCleanup=()=>{};const generation=++encarGeneration;const s=state();document.documentElement.lang=lang;$('mock-toast').hidden=true;
 $('menu-button').setAttribute('aria-label',t('Открыть меню','Відкрити меню'));$('mobile-overlay').setAttribute('aria-label',t('Закрыть меню','Закрити меню'));
 $('market-label').textContent=t('Площадки','Майданчики');$('auction-label').textContent=t('Аукционы','Аукціони');$('market-nav').innerHTML=siteButton('Encar');$('auction-nav').innerHTML=siteButton('Copart')+siteButton('IAA');$('app-settings-label').textContent=t('Настройки приложения','Налаштування застосунку');$('app-settings').classList.toggle('active',section==='appSettings');$('worker-label').textContent=t('Фоновый сервер','Фоновий сервер');$('worker-status').textContent=t('Демонстрационный режим','Демонстраційний режим');$('version-note').textContent=t('макет','макет');
 $('context').innerHTML=section==='appSettings'?e(t('Рабочая область / Настройки приложения','Робоча область / Налаштування застосунку')):e(t('Рабочая область','Робоча область'))+` / <strong>${source}</strong> / ${e(sectionNames()[section])}`;
 $('next-run').innerHTML=`${e(t('До автообновления','До автооновлення'))}<b>—</b>`;$('active-runs').innerHTML=`${e(t('Активные запуски','Активні запуски'))}<b>${Object.values(demoRuns).flat().filter(r=>r.status==='running').length}</b>`;$('ru-button').classList.toggle('on',lang==='ru');$('uk-button').classList.toggle('on',lang==='uk');
 $('page-title').textContent=section==='appSettings'?t('Настройки приложения','Налаштування застосунку'):section==='projects'?source:section==='runs'?t('История запусков','Історія запусків'):t('Настройки','Налаштування')+' '+source;
 $('page-subtitle').textContent=section==='projects'?t('Проекты и автомобили этого сайта','Проєкти та автомобілі цього сайту'):section==='runs'?t('Поиски и публикации · только','Пошуки та публікації · лише')+' '+source:t('Параметры своей области, без дублирования','Параметри своєї області, без дублювання');
 $('page-actions').innerHTML=section==='projects'?`<button class="app-button primary" id="new-project">${icon('plus')}${e(t('Создать проект','Створити проєкт'))}</button>`:'';
 $('prototype-note').textContent=t('Макет интеграции · demo-данные · 8 октября, 12:37 · ничего не запускается и не отправляется','Макет інтеграції · demo-дані · 8 жовтня, 12:37 · нічого не запускається й не надсилається');$('state-link').innerHTML=e(t('Все состояния карточки','Усі стани картки'))+icon('external');$('menu-button').innerHTML=icon('menu');$('app-settings-icon').innerHTML=icon('settings');
 const preservedEncar=source==='Encar'&&['projects','runs'].includes(section);document.querySelector('.app-title-row').hidden=preservedEncar;$('screen').innerHTML=preservedEncar?`<div id="encar-preserved-host"></div>`:section==='projects'?projectsScreen():section==='runs'?runsScreen():settingsScreen(section==='appSettings');if(preservedEncar)mountEncarPreview(generation);
 document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{source=b.dataset.source;section=state().section;closeMenu();render();});document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;state().section=section;closeMenu();render();});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;render();});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{s.project=b.dataset.project;render();});document.querySelectorAll('[data-project-settings]').forEach(b=>b.onclick=()=>projectModal(projects[source].find(p=>p.id===b.dataset.projectSettings)));

 if($('project-collapse'))$('project-collapse').onclick=()=>{s.collapsed=!s.collapsed;render();};if($('project-sort'))$('project-sort').onchange=()=>{s.sort=$('project-sort').value;render();};if($('project-filter'))$('project-filter').onchange=()=>{s.projectFilter=$('project-filter').value;render();};
 if($('current-settings'))$('current-settings').onclick=()=>projectModal(projects[source].find(p=>p.id===s.project));if($('new-project'))$('new-project').onclick=()=>openEditor();
 if(['projects','runs'].includes(section))$('screen').insertAdjacentHTML('afterbegin',sourceNoticeHTML(source,availability[source],lang));
 if(section==='runs'&&source!=='Encar')bindHistory();bindSettings();launchPreview.bind();
}
$('app-settings').onclick=()=>{section='appSettings';closeMenu();render();};$('ru-button').onclick=()=>{lang='ru';render();};$('uk-button').onclick=()=>{lang='uk';render();};$('menu-button').onclick=()=>{$('app-shell').classList.add('menu-open');$('menu-button').setAttribute('aria-expanded','true');document.querySelector('.workspace').inert=true;document.querySelector('.source-button').focus();};$('mobile-overlay').onclick=closeMenu;$('dialog-close').onclick=()=>$('dialog').close();$('dialog').onclose=()=>{editor=null;};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});render();

</script></body></html>
