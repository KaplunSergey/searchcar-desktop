name: macOS desktop pilot

on:
  workflow_dispatch:
    inputs:
      include_diagnostic_standalone:
        description: "Also compile and check the slow standalone diagnostic sidecar"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      PYTHONUTF8: "1"
      SEARCHCAR_MACOS_LOCAL_KEY_FALLBACK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install project dependencies
        run: |
          python -m pip install -r backend/requirements-desktop-build.txt
          pnpm install --frozen-lockfile

      - name: Verify product version metadata
        run: pnpm version:check

      - name: Run backend and frontend tests
        run: |
          export PYTHONPATH="$PWD/backend"
          export STORAGE_ROOT="$RUNNER_TEMP/searchcar-test-storage"
          export DATABASE_URL="sqlite+pysqlite:///$RUNNER_TEMP/searchcar-tests.sqlite3"
          python -m pytest backend/tests -q
          pnpm build
          pnpm test
          pnpm desktop:frontend:build

      - name: Prepare browser and external Playwright driver
        run: |
          python scripts/prepare_desktop_browser.py
          python scripts/prepare_desktop_playwright_driver.py

      - name: Compile diagnostic standalone sidecar
        if: ${{ inputs.include_diagnostic_standalone == true }}
        run: |
          python scripts/build_desktop_sidecar.py --mode standalone
          standalone="$(find work/nuitka/aarch64-apple-darwin/standalone -type f -name 'searchcar-core-aarch64-apple-darwin' | head -n 1)"
          test -n "$standalone"
          "$standalone" check --data-dir "$RUNNER_TEMP/searchcar-standalone-check" --port 18771

      - name: Compile onefile production sidecar
        run: python scripts/build_desktop_sidecar.py --mode onefile

      - name: Smoke-test compiled backend and Chromium
        run: |
          scripts/macos_desktop_smoke.sh \
            desktop/src-tauri/binaries/searchcar-core-aarch64-apple-darwin \
            desktop/runtime/browsers \
            desktop/runtime/playwright-driver \
            desktop/dist \
            "$RUNNER_TEMP/searchcar-compiled-smoke" \
            work/macos-smoke

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi

      - name: Build unsigned macOS application and updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm desktop:tauri:build \
            --target aarch64-apple-darwin \
            --bundles app \
            --no-sign \
            --ci

      - name: Verify and archive application
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          app="$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -x "$app/Contents/MacOS/searchcar-core"
          test -x "$app/Contents/Resources/playwright-driver/node"
          test -f "$app/Contents/Resources/browsers/searchcar-browser-manifest.json"
          test -f "$app/Contents/Resources/desktop-ui/index.html"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p work/macos-artifact

          updater="$app.tar.gz"
          rm -f "$updater" "$updater.sig"
          tar -czf "$updater" -C "$(dirname "$app")" "$(basename "$app")"
          pnpm exec tauri signer sign "$updater"
          test -s "$updater"
          test -s "$updater.sig"
          updater_artifact="work/macos-artifact/SearchCar-Desktop-macOS-arm64.app.tar.gz"
          cp "$updater" "$updater_artifact"
          cp "$updater.sig" "$updater_artifact.sig"

          ditto -c -k --sequesterRsrc --keepParent "$app" \
            work/macos-artifact/SearchCar-Desktop-macOS-arm64.zip
          shasum -a 256 \
            work/macos-artifact/SearchCar-Desktop-macOS-arm64.zip \
            "$updater_artifact" \
            > work/macos-artifact/SHA256SUMS.txt
          cat work/macos-artifact/SHA256SUMS.txt

      - name: Upload macOS pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: searchcar-desktop-macos-arm64-pilot
          path: |
            work/macos-artifact/**
            work/macos-smoke/**
          if-no-files-found: error
          retention-days: 14
