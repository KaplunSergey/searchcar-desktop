name: Windows desktop pilot

on:
  workflow_dispatch:
    inputs:
      include_diagnostic_standalone:
        description: "Also compile and check the slow standalone diagnostic sidecar"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 sidecar and NSIS
    runs-on: windows-latest
    environment: license-production
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-desktop-build.txt
          pnpm install --frozen-lockfile

      - name: Verify product version metadata
        shell: pwsh
        run: pnpm version:check

      - name: Run backend and frontend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $pwd "backend"
          $env:STORAGE_ROOT = Join-Path $env:RUNNER_TEMP "searchcar-test-storage"
          $testDatabase = Join-Path $env:RUNNER_TEMP "searchcar-tests.sqlite3"
          $env:DATABASE_URL = "sqlite+pysqlite:///$($testDatabase.Replace('\', '/'))"
          python -m pytest backend/tests -q
          pnpm build
          pnpm test
          pnpm desktop:frontend:build

      - name: Prepare browser and external Playwright driver
        shell: pwsh
        run: |
          python scripts/prepare_desktop_browser.py
          python scripts/prepare_desktop_playwright_driver.py

      # Keep one reusable compiler cache. It is deliberately not keyed by the
      # commit SHA: GitHub caches are immutable, and a new cache per commit
      # would quickly exceed the private-repository allowance.
      - name: Restore bounded Nuitka compile cache
        id: nuitka-cache
        uses: actions/cache/restore@v4
        with:
          path: work/nuitka/cache
          key: windows-nuitka-compile-v1-${{ hashFiles('backend/requirements.txt', 'backend/requirements-desktop-build.txt') }}

      - name: Compile diagnostic standalone sidecar
        if: ${{ inputs.include_diagnostic_standalone == true }}
        shell: pwsh
        run: |
          python scripts/build_desktop_sidecar.py --mode standalone
          $standalone = Get-ChildItem `
            "work/nuitka/x86_64-pc-windows-msvc/standalone" `
            -Filter "searchcar-core-x86_64-pc-windows-msvc.exe" `
            -File -Recurse | Select-Object -First 1
          if (-not $standalone) {
            throw "Standalone sidecar was not produced"
          }
          & $standalone.FullName check `
            --data-dir "$env:RUNNER_TEMP/searchcar-standalone-check" `
            --port 18771
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone sidecar check failed"
          }

      - name: Compile onefile production sidecar
        shell: pwsh
        run: |
          python scripts/build_desktop_sidecar.py --mode onefile

      - name: Save bounded Nuitka compile cache
        if: ${{ success() && steps.nuitka-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: work/nuitka/cache
          key: ${{ steps.nuitka-cache.outputs.cache-primary-key }}

      - name: Smoke-test compiled backend and Chromium
        shell: pwsh
        run: |
          scripts/windows_desktop_smoke.ps1 `
            -Sidecar "desktop/src-tauri/binaries/searchcar-core-x86_64-pc-windows-msvc.exe" `
            -BrowserDir "desktop/runtime/browsers" `
            -PlaywrightDriverDir "desktop/runtime/playwright-driver" `
            -FrontendDir "desktop/dist" `
            -RuntimeRoot "$env:RUNNER_TEMP/searchcar-compiled-smoke" `
            -OutputDir "work/windows-smoke"

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: Build unsigned offline NSIS installer and updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm desktop:tauri:build --bundles nsis --no-sign --ci

      - name: Verify installer and write checksum
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/release/bundle/nsis" `
              -Filter "*-setup.exe" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force "work/windows-smoke" | Out-Null
          New-Item -ItemType Directory -Force "work/windows-artifact" | Out-Null
          $installer = $installers[0]
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
            pnpm exec tauri signer sign $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign the Windows updater artifact"
            }
          }
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
            throw "Windows updater signature was not produced"
          }
          if ((Get-Item -LiteralPath $signature).Length -eq 0) {
            throw "Windows updater signature is empty"
          }
          $artifactInstaller = "work/windows-artifact/SearchCar-Desktop-Windows-x64-setup.exe"
          $artifactSignature = "$artifactInstaller.sig"
          Copy-Item -LiteralPath $installer.FullName -Destination $artifactInstaller
          Copy-Item -LiteralPath $signature -Destination $artifactSignature
          cargo run --quiet --locked `
            --manifest-path desktop/src-tauri/Cargo.toml `
            --features updater-signature-verifier `
            --bin verify_updater_signature -- `
            desktop/updater-public-key.txt $artifactInstaller $artifactSignature
          if ($LASTEXITCODE -ne 0) {
            throw "Windows updater signature does not match desktop/updater-public-key.txt"
          }
          $tamperedInstaller = "work/windows-smoke/tampered-updater.exe"
          $tamperedBytes = [System.IO.File]::ReadAllBytes($artifactInstaller)
          $tamperedBytes[$tamperedBytes.Length - 1] = $tamperedBytes[$tamperedBytes.Length - 1] -bxor 1
          [System.IO.File]::WriteAllBytes($tamperedInstaller, $tamperedBytes)
          cargo run --quiet --locked `
            --manifest-path desktop/src-tauri/Cargo.toml `
            --features updater-signature-verifier `
            --bin verify_updater_signature -- `
            desktop/updater-public-key.txt $tamperedInstaller $artifactSignature
          if ($LASTEXITCODE -eq 0) {
            throw "Tampered updater unexpectedly passed signature verification"
          }
          Remove-Item -LiteralPath $tamperedInstaller -Force
          $artifactHash = (Get-FileHash $artifactInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactHash  SearchCar-Desktop-Windows-x64-setup.exe" | Set-Content `
            "work/windows-artifact/SHA256SUMS.txt" -Encoding ascii
          $summary = [ordered]@{
            file = "SearchCar-Desktop-Windows-x64-setup.exe"
            bytes = (Get-Item $artifactInstaller).Length
            sha256 = $artifactHash
            target = "x86_64-pc-windows-msvc"
            os_code_signed = $false
            updater_signed = $true
          }
          $summary | ConvertTo-Json | Set-Content `
            "work/windows-smoke/installer.json" -Encoding utf8
          Get-Content "work/windows-smoke/installer.json"

      - name: Upload Windows pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: searchcar-desktop-windows-x64-pilot
          path: |
            work/windows-artifact/**
            work/windows-smoke/**
            work/nuitka/**/nuitka-report.xml
          if-no-files-found: error
          retention-days: 14
