name: Windows desktop pilot

on:
  workflow_dispatch:
    inputs:
      include_diagnostic_standalone:
        description: "Also compile and check the slow standalone diagnostic sidecar"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 sidecar and NSIS
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Verify Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup default stable-msvc
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-desktop-build.txt
          pnpm install --frozen-lockfile

      - name: Run backend and frontend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $pwd "backend"
          $env:STORAGE_ROOT = Join-Path $env:RUNNER_TEMP "searchcar-test-storage"
          $testDatabase = Join-Path $env:RUNNER_TEMP "searchcar-tests.sqlite3"
          $env:DATABASE_URL = "sqlite+pysqlite:///$($testDatabase.Replace('\', '/'))"
          python -m pytest backend/tests -q
          pnpm build
          pnpm test
          pnpm desktop:frontend:build

      - name: Prepare browser and external Playwright driver
        shell: pwsh
        run: |
          python scripts/prepare_desktop_browser.py
          python scripts/prepare_desktop_playwright_driver.py

      - name: Compile diagnostic standalone sidecar
        if: ${{ inputs.include_diagnostic_standalone == true }}
        shell: pwsh
        run: |
          python scripts/build_desktop_sidecar.py --mode standalone
          $standalone = Get-ChildItem `
            "work/nuitka/x86_64-pc-windows-msvc/standalone" `
            -Filter "searchcar-core-x86_64-pc-windows-msvc.exe" `
            -File -Recurse | Select-Object -First 1
          if (-not $standalone) {
            throw "Standalone sidecar was not produced"
          }
          & $standalone.FullName check `
            --data-dir "$env:RUNNER_TEMP/searchcar-standalone-check" `
            --port 18771
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone sidecar check failed"
          }

      - name: Compile onefile production sidecar
        shell: pwsh
        run: |
          python scripts/build_desktop_sidecar.py --mode onefile

      - name: Smoke-test compiled backend and Chromium
        shell: pwsh
        run: |
          scripts/windows_desktop_smoke.ps1 `
            -Sidecar "desktop/src-tauri/binaries/searchcar-core-x86_64-pc-windows-msvc.exe" `
            -BrowserDir "desktop/runtime/browsers" `
            -PlaywrightDriverDir "desktop/runtime/playwright-driver" `
            -FrontendDir "desktop/dist" `
            -RuntimeRoot "$env:RUNNER_TEMP/searchcar-compiled-smoke" `
            -OutputDir "work/windows-smoke"

      - name: Build unsigned offline NSIS installer
        shell: pwsh
        run: |
          pnpm desktop:tauri:build --bundles nsis --no-sign --ci

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem `
              "desktop/src-tauri/target/release/bundle/nsis" `
              -Filter "*-setup.exe" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force "work/windows-smoke" | Out-Null
          $installer = $installers[0]
          $summary = [ordered]@{
            file = $installer.Name
            bytes = $installer.Length
            sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            target = "x86_64-pc-windows-msvc"
            signed = $false
          }
          $summary | ConvertTo-Json | Set-Content `
            "work/windows-smoke/installer.json" -Encoding utf8
          Get-Content "work/windows-smoke/installer.json"

      - name: Upload Windows pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: searchcar-desktop-windows-x64-pilot
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            work/windows-smoke/**
          if-no-files-found: error
          retention-days: 14
