name: Windows installer smoke probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        simulation: [Rename, Overwrite]
    steps:
      - uses: actions/checkout@v6
      - name: Download checksum-verified published installer
        shell: pwsh
        run: |
          $base = 'https://github.com/KaplunSergey/searchcar-desktop-releases/releases/download/v0.3.1'
          $installer = Join-Path $env:RUNNER_TEMP 'SearchCar-Desktop-Windows-x64-setup.exe'
          Invoke-WebRequest "$base/SearchCar-Desktop-Windows-x64-setup.exe" -OutFile $installer
          $sumsFile = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile $sumsFile
          # GitHub serves assets as octet-stream; .Content may be byte[], not text.
          $sums = Get-Content -LiteralPath $sumsFile -Raw -Encoding utf8
          $match = [regex]::Match($sums, '(?im)^([a-f0-9]{64})\s+SearchCar-Desktop-Windows-x64-setup\.exe\s*$')
          if (-not $match.Success) { throw 'Published checksum file has no Windows installer entry' }
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $match.Groups[1].Value) { throw "Published installer checksum mismatch: actual=$actual; expected=$($match.Groups[1].Value)" }
      - name: Probe file replacement and shortcut tracking
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'SearchCar-Desktop-Windows-x64-setup.exe'
          $simulation = '${{ matrix.simulation }}'
          scripts/windows_installer_update_smoke.ps1 -Installer $installer -Simulation $simulation
          Write-Host "RESULT: $simulation passed"
