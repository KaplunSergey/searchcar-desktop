<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Запуск SearchCar</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #14213a;
        background: #f4f7fc;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; padding: 28px; }
      main { width: 100%; text-align: center; }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        border-radius: 20px;
        color: white;
        background: linear-gradient(145deg, #356bdc, #2757c4);
        box-shadow: 0 14px 32px rgba(41, 89, 196, 0.24);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -0.025em; }
      #stage { min-height: 48px; margin: 14px auto 0; color: #657897; font-size: 16px; line-height: 1.5; }
      .loader {
        position: relative;
        width: 220px;
        height: 5px;
        margin: 26px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #dce5f4;
      }
      .loader::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 -35%;
        width: 35%;
        border-radius: inherit;
        background: #356bdc;
        animation: loading 1.25s ease-in-out infinite;
      }
      #elapsed { margin-top: 15px; color: #91a0b8; font-size: 13px; }
      body[data-state="error"] .loader::after { display: none; }
      body[data-state="error"] .loader { background: #f3c6cb; }
      body[data-state="error"] #stage { color: #a52c39; }
      @keyframes loading { 0% { left: 0; } 50% { left: 82%; } 100% { left: 135%; } }
      @media (prefers-reduced-motion: reduce) { .loader::after { animation-duration: 2.5s; } }
    </style>
  </head>
  <body data-state="loading">
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">SC</div>
      <h1>Запускаем SearchCar</h1>
      <p id="stage">Проверяем локальные данные…</p>
      <div class="loader" aria-hidden="true"></div>
      <div id="elapsed">Обычно это занимает несколько секунд</div>
    </main>
    <script>
      const stage = document.getElementById("stage");
      const elapsed = document.getElementById("elapsed");
      const startedAt = Date.now();

      window.searchcarStartup = {
        setState(state, message) {
          document.body.dataset.state = state;
          stage.textContent = message;
          if (state === "error") elapsed.textContent = "Выберите дальнейшее действие в диалоге";
        },
      };

      setInterval(() => {
        if (document.body.dataset.state !== "loading") return;
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        if (seconds >= 15) elapsed.textContent = `Подготовка продолжается: ${seconds} сек.`;
      }, 1000);
    </script>
  </body>
</html>
