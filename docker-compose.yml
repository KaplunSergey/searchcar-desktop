services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-encar}
      POSTGRES_USER: ${POSTGRES_USER:-encar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-encar}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-encar} -d ${POSTGRES_DB:-encar}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    volumes: ["./backend:/app", "./storage:/storage", "${LEGACY_DATA_DIR:-./legacy-data}:/legacy:ro"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    volumes: ["./backend:/app", "./storage:/storage"]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build: .
    command: pnpm exec vinext dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-encar_csrf}
    volumes: [".:/site", "/site/node_modules"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
